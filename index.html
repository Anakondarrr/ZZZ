<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест для тебя 💝</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; 
            background: linear-gradient(145deg, #1a1a2e, #16213e); font-family: 'Segoe UI', sans-serif;
        }
        .container { 
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 40px; 
            border-radius: 40px; width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.1); text-align: center;
        }
        h1 { color: #fff; font-size: 24px; margin-bottom: 10px; }
        p.sub { color: #aaa; margin-bottom: 30px; }
        .question { color: #fff; font-size: 20px; margin-bottom: 25px; }
        .options button { 
            display: block; width: 100%; padding: 15px; margin-bottom: 12px; 
            border: 2px solid #4a4a6a; border-radius: 16px; background: transparent; 
            color: #fff; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .options button:hover { background: #6c5ce7; border-color: #6c5ce7; transform: scale(1.02); }
        .hidden { display: none; }
        #prize { 
            margin-top: 20px; padding: 30px; background: linear-gradient(135deg, #f7971e, #ffd200);
            border-radius: 30px; color: #1a1a2e;
        }
        #prize h2 { font-size: 28px; }
        #prize .btn { 
            display: inline-block; margin-top: 20px; padding: 15px 40px; background: #1a1a2e; 
            color: #fff; border-radius: 60px; text-decoration: none; font-weight: bold;
        }
        .step { display: none; }
        .step.active { display: block; animation: fade 0.5s; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="container">
    <h1>🎁 Секретный квест</h1>
    <p class="sub">Ответь на 2 вопроса и получи приз</p>

    <!-- Шаг 1 -->
    <div id="step1" class="step active">
        <div class="question">Какой у нас был первый поцелуй?</div>
        <div class="options">
            <button onclick="nextStep(2)">На крыше</button>
            <button onclick="nextStep(2)">У моря</button>
            <button onclick="nextStep(2)">В парке</button>
            <button onclick="nextStep(2)">В кафе</button>
        </div>
    </div>

    <!-- Шаг 2 -->
    <div id="step2" class="step">
        <div class="question">Моё любимое блюдо, которое ты готовишь?</div>
        <div class="options">
            <button onclick="nextStep(3)">Паста</button>
            <button onclick="nextStep(3)">Суши</button>
            <button onclick="nextStep(3)">Омлет</button>
            <button onclick="nextStep(3)">Салат</button>
        </div>
    </div>

    <!-- Финал -->
    <div id="step3" class="step">
        <div id="prize">
            <span style="font-size:48px;">🎉</span>
            <h2>Ты выиграла 5000 ₽!</h2>
            <p style="margin-top:10px; font-weight:500;">Нажми кнопку, чтобы забрать</p>
            <!-- ЗДЕСЬ ТЫ МЕНЯЕШЬ ССЫЛКУ НА СВОЙ QR/СБП -->
            <a href="https://www.tbank.ru/qr/" class="btn" target="_blank">💰 Забрать приз</a>
            <p style="margin-top:15px; font-size:12px; opacity:0.7;">(откроется перевод по СБП)</p>
        </div>
    </div>
</div>

<script>
    let current = 1;

    function nextStep(step) {
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + step).classList.add('active');
        current = step;
        
        // Если перешли на финал (шаг 3) — отправляем письмо
        if (step === 3) {
            notifyEmail();
        }
        
        // Автоматический переход через 2 сек после 2-го вопроса
        if(step === 2) setTimeout(() => nextStep(3), 1500);
    }

    // ===== ОТПРАВКА НА ПОЧТУ ЧЕРЕЗ FORMSPREE =====
    async function notifyEmail() {
        // ЗАМЕНИ ЭТОТ ID НА СВОЙ (получишь на formspree.io)
        const formId = 'https://formspree.io/f/mjyvobrd';
        const url = `https://formspree.io/f/mjyvobrd`;

        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: 'Квест пройден! 🎉',
                    message: 'Девушка прошла тест! Подарок будет отправлен через 60 минут.'
                })
            });
            console.log('✅ Письмо отправлено!');
        } catch (error) {
            console.error('❌ Ошибка:', error);
        }
    }
</script>

</body>
</html>
