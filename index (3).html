
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Квиз</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url("https://i.pinimg.com/originals/62/5f/0f/625f0f5571a67136d86f2a999eee8427.jpg") repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .options button {
            background: #fff;
            color: #333;
            border: 2px solid #fda085;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .options button:hover:not(:disabled) {
            background: #fda085;
            color: #fff;
            transform: translateY(-2px);
        }

        .options button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #errorMsg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            color: #d8000c;
            background-color: #ffd2d2;
            display: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .confetti-piece, .hearts-rain {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="card" id="quizCard">
        <h2 id="questionText">Загрузка вопроса...</h2>
        <div class="options" id="optionsContainer"></div>
        <div id="errorMsg"></div>
    </div>

    <script>
        // ========== НАСТРОЙКИ FORMSPREE ==========
        const FORMSPREE_URL = 'https://formspree.io/f/mjyvobrd';

        async function sendFormspreeNotification() {
            try {
                await fetch(FORMSPREE_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '🎉 Она прошла тест! Подарок будет отправлен через 60 минут.'
                    })
                });
                console.log('Уведомление успешно отправлено на почту!');
            } catch (error) {
                console.error('Ошибка отправки Formspree:', error);
            }
        }

        // ========== КОНФЕТТИ ==========
        function launchConfetti() {
            const emojis = ['🎉', '🎊', '⭐', '💖', '✨', '🎈', '🌈'];
            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                confetti.style.fontSize = (Math.random() * 30 + 20) + 'px';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // ========== ДОЖДЬ ИЗ СЕРДЕЧЕК ==========
        function launchHearts() {
            const hearts = ['❤️', '🧡', '💛', '💚', '💙', '💜', '🩷', '💝'];
            for (let i = 0; i < 50; i++) {
                const heart = document.createElement('div');
                heart.className = 'hearts-rain';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-10px';
                heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
                heart.style.opacity = Math.random() * 0.7 + 0.3;
                heart.style.animationDuration = (Math.random() * 4 + 3) + 's';
                heart.style.animationDelay = Math.random() * 3 + 's';
                heart.style.animation = `fall ${Math.random() * 4 + 3}s linear forwards`;
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 7000);
            }
        }

        // ========== ФИНАЛ (ОДНА ФУНКЦИЯ) ==========
        function finishQuiz() {
            sendFormspreeNotification();
            launchConfetti();
            launchHearts();

            // Шаг 1: Поздравление
            setTimeout(() => {
                document.getElementById('quizCard').innerHTML = `
                    <h2>🎉 Ура! Ты прошла тест!</h2>
                    <p style="font-size: 18px; margin-top: 10px;">Твой подарок уже в пути... 🎁</p>
                `;
            }, 500);

            // Шаг 2: Послание (через 3 секунды)
            setTimeout(() => {
                document.getElementById('quizCard').innerHTML = `
                    <div style="background: linear-gradient(135deg, #f6d365, #fda085); padding: 25px; border-radius: 15px;">
                        <h2 style="color: #1a1a2e;">💌 Послание</h2>
                        <p style="font-size: 18px; margin-top: 15px; line-height: 1.6; color: #1a1a2e;">
                            Я тебя очень люблю! В моей жизни ты стала очень важным любимым человеком.<br>
                            Спасибо, что ты есть. Чтобы не произошло между нами, знай, что<br>
                            я всегда думаю о тебе со всей любовью и нежностью ❤️.
                        </p>
                        <p style="margin-top: 15px; font-size: 14px; opacity: 0.7; color: #1a1a2e;">
                            Подарок придёт в течение 60 минут на твою карту 🎁
                        </p>
                    </div>
                `;
            }, 3000);
        }

        // ========== ДАННЫЕ КВИЗА ==========
        const questions = [
            {
                question: "Когда началась наша переписка?",
                answers: ["17 мая", "4 августа", "4 февраля", "15 октября"],
                correct: 0 
            },
            {
                question: "Наше первое свидание прошло ...",
                answers: ["В кафе", "в кинотеатре", "В парке", "На выставке"],
                correct: 2
            },
            {
                question: "Первый фильм на который мы вместе сходили назывался ...",
                answers: ["Материалистка", "Дракула", "Зверополис", "Лило и Стич"],
                correct: 3
            },
            {
                question: "А когда мы договорились о том, что пойдем на него?",
                answers: ["На репетиции вальса", "В переписке", "На беседках", "Нет правильного ответа"],
                correct: 0
            },
            {
                question: "Где произошел наш первый поцелуй?",
                answers: ["На репетиции вальса", "На катке", "На беседках", "Нет правильного ответа"],
                correct: 1
            },
            {
                question: "И наконец, когда начались наши отношения?",
                answers: ["4 марта", "4 января", "4 февраля", "4 декабря"],
                correct: 2
            }
        ];

        let currentQuestion = 0;
        let errors = 0;
        const maxErrors = 3;
        const errorMsg = document.getElementById('errorMsg');

        // ========== ЗАГРУЗКА ВОПРОСА ==========
        function loadQuestion(index) {
            if (index >= questions.length) {
                finishQuiz();
                return;
            }

            const q = questions[index];
            document.getElementById('questionText').textContent = q.question;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.answers.forEach((answer, i) => {
                const btn = document.createElement('button');
                btn.textContent = answer;
                btn.dataset.index = i;
                btn.addEventListener('click', () => checkAnswer(btn, i));
                container.appendChild(btn);
            });

            errorMsg.style.display = 'none';
            document.querySelectorAll('.options button').forEach(b => b.disabled = false);
        }

        // ========== ПРОВЕРКА ОТВЕТА ==========
        function checkAnswer(button, selected) {
            const q = questions[currentQuestion];

            if (selected === q.correct) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                errors++;
                errorMsg.style.display = 'block';

                if (errors >= maxErrors) {
                    errorMsg.innerHTML = '😅 Ты использовала все попытки! Начинаем сначала...';
                    errorMsg.style.background = 'rgba(255,0,0,0.2)';
                    document.querySelectorAll('.options button').forEach(b => b.disabled = true);
                    setTimeout(() => location.reload(), 2500);
                } else {
                    const attemptsLeft = maxErrors - errors;
                    errorMsg.innerHTML = '❌ Неверно! Осталось попыток: ' + attemptsLeft;
                    button.style.animation = 'shake 0.4s';
                    setTimeout(() => { button.style.animation = ''; }, 400);
                }
            }
        }

        // ========== ЗАПУСК ==========
        loadQuestion(currentQuestion);
    </script>

</body>
</html>
